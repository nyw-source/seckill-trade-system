server:
  port: 8085
spring:
  mvc:
    # Spring Boot 2.6+ 默认 PathPatternParser，springfox(knife4j 依赖) 未适配，
    # 启动时会抛 documentationPluginsBootstrapper NPE 导致服务无法启动，这里回退到 AntPathMatcher
    pathmatch:
      matching-strategy: ant_path_matcher
  application:
    name: seckill-service
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: 192.168.112.130:8848
    sentinel:
      transport:
        dashboard: 192.168.112.130:8090
        port: 8719
      datasource:
        ds1:
          nacos:
            server-addr: 192.168.112.130:8848
            data-id: seckill-service-sentinel
            group-id: DEFAULT_GROUP
            data-type: json
            rule-type: flow
  datasource:
    url: jdbc:mysql://192.168.112.130:3306/nyw?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  redis:
    host: 192.168.112.130
    port: 6379
    password: 123456
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 4
  rabbitmq:
    host: 192.168.112.130
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # 重试 3 次仍失败的消息「拒绝且不重回队列」，否则会无限重投刷爆日志
        # 拒绝的消息由队列死信配置转到 seckill.dead.queue，走幂等关单逻辑兜底
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
nyw:
  seckill:
    # 未支付订单超时时间（分钟）：延迟队列 TTL 与扫表兜底阈值共用，联调时可压短成 1
    order-timeout-minutes: 15
    # 热点商品 + 库存定时预热：每分钟扫一次「进行中 + 未来 30 分钟即将开始」的场次
    preheat-cron: "0 * * * * ?"
    # 超时订单扫表兜底：每 2 分钟一次，与延迟队列构成双保险
    close-scan-cron: "0 */2 * * * ?"
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    com.nyw: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 秒杀服务接口文档
    description: "秒杀服务接口文档"
    email: 19371047352@163.com
    concat: NYW
    url: https://github.com/nyw-source
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.nyw.seckill.controller
