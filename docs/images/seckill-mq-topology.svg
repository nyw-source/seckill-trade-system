<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" width="1060" height="620" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#656d76"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250df"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="620" fill="#ffffff"/>
  <text x="28" y="34" font-size="20" font-weight="700" fill="#1f2328">秒杀下单 · 超时关单消息拓扑（双保险）</text>

  <!-- ① 建单链路 -->
  <text x="28" y="60" font-size="13" font-weight="700" fill="#0969da">① 建单链路 —— 立即生效</text>

  <rect x="80" y="72" width="210" height="66" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="185" y="98" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">seckill.order</text>
  <text x="185" y="115" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">.exchange</text>
  <text x="185" y="131" font-size="10" fill="#656d76" text-anchor="middle">建单交换机</text>

  <line x1="294" y1="105" x2="416" y2="105" stroke="#656d76" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="355" y="98" font-size="9" fill="#656d76" text-anchor="middle">seckill.order.create</text>

  <rect x="420" y="72" width="210" height="66" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="525" y="98" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">seckill.order</text>
  <text x="525" y="115" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">.queue</text>
  <text x="525" y="131" font-size="10" fill="#656d76" text-anchor="middle">有消费者 · 不配 TTL</text>

  <line x1="634" y1="105" x2="756" y2="105" stroke="#656d76" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="695" y="98" font-size="9" fill="#656d76" text-anchor="middle">consume</text>

  <rect x="760" y="72" width="210" height="66" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="865" y="98" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">createSeckillOrder</text>
  <text x="865" y="115" font-size="10" fill="#656d76" text-anchor="middle">订单落库</text>
  <text x="865" y="131" font-size="10" fill="#656d76" text-anchor="middle">+ DB 原子扣减库存</text>

  <path d="M525,138 V178" stroke="#8250df" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#p)"/>
  <text x="540" y="163" font-size="9" fill="#8250df">重试 3 次仍失败 → 拒绝且不重回队列</text>

  <rect x="420" y="178" width="210" height="62" rx="9" fill="#faf5ff" stroke="#8250df" stroke-dasharray="5 3"/>
  <text x="525" y="202" font-size="12" font-weight="700" fill="#8250df" text-anchor="middle">seckill.dead.queue</text>
  <text x="525" y="221" font-size="10" fill="#656d76" text-anchor="middle">订单已随事务回滚 →</text>
  <text x="525" y="235" font-size="10" fill="#656d76" text-anchor="middle">CAS 关单 0 行，天然幂等跳过</text>

  <!-- ② 延迟关单链路 -->
  <text x="28" y="290" font-size="13" font-weight="700" fill="#cf222e">② 延迟关单链路 —— TTL 15 分钟后触发</text>

  <rect x="30" y="306" width="152" height="76" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="106" y="328" font-size="11" font-weight="700" fill="#1f2328" text-anchor="middle">seckill.order</text>
  <text x="106" y="344" font-size="11" font-weight="700" fill="#1f2328" text-anchor="middle">delay.exchange</text>
  <text x="106" y="366" font-size="10" fill="#656d76" text-anchor="middle">延迟交换机</text>

  <line x1="186" y1="344" x2="242" y2="344" stroke="#656d76" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="214" y="337" font-size="9" fill="#656d76" text-anchor="middle">order.delay</text>

  <rect x="246" y="306" width="152" height="76" rx="9" fill="#fff1f0" stroke="#cf222e" stroke-width="2"/>
  <text x="322" y="328" font-size="11" font-weight="700" fill="#cf222e" text-anchor="middle">seckill.order</text>
  <text x="322" y="344" font-size="11" font-weight="700" fill="#cf222e" text-anchor="middle">delay.queue</text>
  <text x="322" y="366" font-size="10" fill="#cf222e" text-anchor="middle">⭐ 无消费者 · TTL 15min</text>

  <line x1="402" y1="344" x2="458" y2="344" stroke="#cf222e" stroke-width="1.6" marker-end="url(#r)"/>
  <text x="430" y="337" font-size="9" fill="#cf222e" text-anchor="middle">TTL 到期</text>

  <rect x="462" y="306" width="152" height="76" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="538" y="328" font-size="11" font-weight="700" fill="#1f2328" text-anchor="middle">seckill.order</text>
  <text x="538" y="344" font-size="11" font-weight="700" fill="#1f2328" text-anchor="middle">close.exchange</text>
  <text x="538" y="366" font-size="10" fill="#656d76" text-anchor="middle">死信交换机</text>

  <line x1="618" y1="344" x2="674" y2="344" stroke="#656d76" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="646" y="337" font-size="9" fill="#656d76" text-anchor="middle">order.close</text>

  <rect x="678" y="306" width="152" height="76" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="754" y="328" font-size="11" font-weight="700" fill="#1f2328" text-anchor="middle">seckill.order</text>
  <text x="754" y="344" font-size="11" font-weight="700" fill="#1f2328" text-anchor="middle">close.queue</text>
  <text x="754" y="366" font-size="10" fill="#656d76" text-anchor="middle">有消费者</text>

  <line x1="834" y1="344" x2="890" y2="344" stroke="#656d76" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="862" y="337" font-size="9" fill="#656d76" text-anchor="middle">consume</text>

  <rect x="894" y="306" width="152" height="76" rx="9" fill="#f0fff4" stroke="#1a7f37" stroke-width="2"/>
  <text x="970" y="328" font-size="11" font-weight="700" fill="#1a7f37" text-anchor="middle">closeTimeoutOrder</text>
  <text x="970" y="348" font-size="10" fill="#656d76" text-anchor="middle">CAS 幂等关单</text>
  <text x="970" y="365" font-size="10" fill="#656d76" text-anchor="middle">+ DB / Redis 库存回补</text>

  <!-- ③ 扫表兜底 -->
  <text x="28" y="428" font-size="13" font-weight="700" fill="#bc4c00">③ 扫表兜底任务 —— 每 2 分钟</text>

  <rect x="30" y="444" width="470" height="70" rx="9" fill="#fff8f0" stroke="#bc4c00"/>
  <text x="265" y="470" font-size="12" font-weight="700" fill="#bc4c00" text-anchor="middle">SeckillTimeoutScanTask</text>
  <text x="265" y="490" font-size="10" fill="#656d76" text-anchor="middle">Redisson 锁保证多实例只有一个真正扫</text>
  <text x="265" y="505" font-size="10" fill="#656d76" text-anchor="middle">status = 1 AND create_time &lt; now − 15min　LIMIT 100</text>

  <line x1="504" y1="479" x2="592" y2="479" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="548" y="472" font-size="9" fill="#bc4c00" text-anchor="middle">捞漏网单</text>

  <rect x="600" y="444" width="446" height="70" rx="9" fill="#f0fff4" stroke="#1a7f37"/>
  <text x="823" y="470" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle">closeTimeoutOrder（复用的代理调用）</text>
  <text x="823" y="492" font-size="10" fill="#656d76" text-anchor="middle">与延迟队列共用同一套 CAS 幂等逻辑</text>
  <text x="823" y="507" font-size="10" fill="#656d76" text-anchor="middle">定时任务必须跨 Bean 调 ISeckillService，否则事务失效</text>

  <!-- 脚注 -->
  <text x="28" y="556" font-size="11" fill="#656d76">幂等：死信可能重复投递，CAS 更新条件为 status = 1，第二次影响行数必为 0 → 直接跳过，库存不会被补多。</text>
  <text x="28" y="576" font-size="11" fill="#656d76">顺序：事务内「CAS 关单 + DB stock + 1」→ 事务提交后「INCR Redis + SREM 一人一单资格」，避免回滚时 Redis 多补。</text>
  <text x="28" y="596" font-size="11" fill="#656d76">⚠ 改 nyw.seckill.order-timeout-minutes 后必须先在 15672 删除 delay.queue：队列级 TTL 是队列属性，参数变更会报 PRECONDITION_FAILED。</text>
</svg>
