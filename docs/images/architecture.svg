<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" width="1060" height="640" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#656d76"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250df"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="640" fill="#ffffff"/>

  <text x="28" y="42" font-size="20" font-weight="700" fill="#1f2328">seckill-trade-system 系统架构</text>
  <text x="28" y="64" font-size="12" fill="#656d76">Spring Cloud Alibaba · 网关统一鉴权 + 5 个业务服务（含秒杀），全部注册于 Nacos 2.x</text>

  <!-- 客户端 -->
  <rect x="430" y="88" width="200" height="48" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="530" y="118" font-size="14" fill="#1f2328" text-anchor="middle">客户端 / JMeter 压测</text>
  <line x1="530" y1="136" x2="530" y2="160" stroke="#656d76" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="540" y="153" font-size="10" fill="#656d76">HTTP</text>

  <!-- 基础设施 -->
  <rect x="740" y="88" width="290" height="64" rx="10" fill="#faf5ff" stroke="#8250df" stroke-dasharray="5 3"/>
  <text x="885" y="114" font-size="13" font-weight="700" fill="#8250df" text-anchor="middle">Nacos 2.x　8848 / 9848 / 9849</text>
  <text x="885" y="134" font-size="11" fill="#656d76" text-anchor="middle">服务注册与发现（客户端走 gRPC 9848）</text>

  <rect x="740" y="176" width="290" height="64" rx="10" fill="#fff8f0" stroke="#bc4c00" stroke-dasharray="5 3"/>
  <text x="885" y="202" font-size="13" font-weight="700" fill="#bc4c00" text-anchor="middle">Sentinel Dashboard:8090</text>
  <text x="885" y="222" font-size="11" fill="#656d76" text-anchor="middle">流控规则下发（未启动不影响功能）</text>

  <!-- 网关 -->
  <rect x="370" y="162" width="320" height="74" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="530" y="192" font-size="15" font-weight="700" fill="#0969da" text-anchor="middle">gateway :8080</text>
  <text x="530" y="214" font-size="11" fill="#656d76" text-anchor="middle">JWT 验签（RS256）· 统一路由 · Sentinel 路由级限流</text>

  <line x1="692" y1="188" x2="736" y2="124" stroke="#8250df" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ap)"/>
  <line x1="692" y1="212" x2="736" y2="208" stroke="#bc4c00" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ao)"/>

  <!-- 路由扇出 -->
  <line x1="530" y1="236" x2="530" y2="286" stroke="#0969da" stroke-width="2"/>
  <line x1="142" y1="286" x2="918" y2="286" stroke="#0969da" stroke-width="2"/>
  <line x1="142" y1="286" x2="142" y2="308" stroke="#0969da" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="336" y1="286" x2="336" y2="308" stroke="#0969da" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="530" y1="286" x2="530" y2="308" stroke="#0969da" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="724" y1="286" x2="724" y2="308" stroke="#0969da" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="918" y1="286" x2="918" y2="308" stroke="#0969da" stroke-width="2" marker-end="url(#ab)"/>
  <text x="1000" y="280" font-size="10" fill="#0969da" text-anchor="end">网关按 Path 断言路由到各服务</text>

  <!-- 业务服务 -->
  <rect x="53" y="310" width="178" height="86" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="142" y="336" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">user-service</text>
  <text x="142" y="356" font-size="12" fill="#656d76" text-anchor="middle">:8083</text>
  <text x="142" y="379" font-size="11" fill="#0969da" text-anchor="middle">/users/**</text>

  <rect x="247" y="310" width="178" height="86" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="336" y="336" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">item-service</text>
  <text x="336" y="356" font-size="12" fill="#656d76" text-anchor="middle">:8081</text>
  <text x="336" y="379" font-size="11" fill="#0969da" text-anchor="middle">/items/**　/search/**</text>

  <rect x="441" y="310" width="178" height="86" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="530" y="336" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">cart-service</text>
  <text x="530" y="356" font-size="12" fill="#656d76" text-anchor="middle">:8082</text>
  <text x="530" y="379" font-size="11" fill="#0969da" text-anchor="middle">/carts/**</text>

  <rect x="635" y="310" width="178" height="86" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="724" y="336" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">order-service</text>
  <text x="724" y="356" font-size="12" fill="#656d76" text-anchor="middle">:8084</text>
  <text x="724" y="379" font-size="11" fill="#0969da" text-anchor="middle">/orders/**　/pay-orders/**</text>

  <rect x="829" y="310" width="178" height="86" rx="10" fill="#fff8f0" stroke="#cf222e" stroke-width="2"/>
  <text x="918" y="336" font-size="14" font-weight="700" fill="#cf222e" text-anchor="middle">seckill-service</text>
  <text x="918" y="356" font-size="12" fill="#656d76" text-anchor="middle">:8085</text>
  <text x="918" y="379" font-size="11" fill="#cf222e" text-anchor="middle">/seckill/**</text>

  <!-- 数据访问总线 -->
  <line x1="142" y1="396" x2="142" y2="436" stroke="#d0d7de" stroke-width="1.4"/>
  <line x1="336" y1="396" x2="336" y2="436" stroke="#d0d7de" stroke-width="1.4"/>
  <line x1="530" y1="396" x2="530" y2="436" stroke="#d0d7de" stroke-width="1.4"/>
  <line x1="724" y1="396" x2="724" y2="436" stroke="#d0d7de" stroke-width="1.4"/>
  <line x1="918" y1="396" x2="918" y2="436" stroke="#d0d7de" stroke-width="1.4"/>
  <line x1="142" y1="436" x2="918" y2="436" stroke="#d0d7de" stroke-width="2"/>
  <text x="530" y="430" font-size="10" fill="#656d76" text-anchor="middle">JDBC · Redis Protocol · AMQP（按各服务实际依赖）</text>

  <line x1="222" y1="436" x2="222" y2="468" stroke="#d0d7de" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="530" y1="436" x2="530" y2="468" stroke="#d0d7de" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="838" y1="436" x2="838" y2="468" stroke="#d0d7de" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- 中间件 -->
  <rect x="82" y="470" width="280" height="76" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="222" y="498" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">MySQL 8.0</text>
  <text x="222" y="520" font-size="11" fill="#656d76" text-anchor="middle">库 nyw · 10 张表 · 原子 SQL 扣减/回补库存</text>

  <rect x="390" y="470" width="280" height="76" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="530" y="498" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Redis 6</text>
  <text x="530" y="520" font-size="11" fill="#656d76" text-anchor="middle">库存 / 一人一单 / 缓存 / 分布式锁</text>

  <rect x="698" y="470" width="280" height="76" rx="10" fill="#fff8f0" stroke="#bc4c00" stroke-width="2"/>
  <text x="838" y="498" font-size="14" font-weight="700" fill="#bc4c00" text-anchor="middle">RabbitMQ</text>
  <text x="838" y="520" font-size="11" fill="#656d76" text-anchor="middle">建单 · 延迟关单 · 死信兜底</text>

  <!-- 脚注 -->
  <text x="28" y="586" font-size="11" fill="#656d76">① 网关是唯一入口：先摘掉客户端自带的 X-User-Id，再按 JWT 解析结果重写并透传，下游服务自行解析。</text>
  <text x="28" y="606" font-size="11" fill="#656d76">② Nacos 2.x 客户端走 gRPC 9848，只放行 8848 会导致服务注册失败、应用启动即退出。</text>
  <text x="28" y="626" font-size="11" fill="#656d76">③ 秒杀热路径（Redis + Lua → MQ）不依赖 item / cart / user 服务。</text>
</svg>
