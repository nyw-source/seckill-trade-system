server:
  port: 8081
spring:
  mvc:
    # Spring Boot 2.6+ 默认 PathPatternParser，springfox(knife4j 依赖) 未适配，
    # 启动时会抛 documentationPluginsBootstrapper NPE 导致服务无法启动，这里回退到 AntPathMatcher
    pathmatch:
      matching-strategy: ant_path_matcher
  application:
    name: item-service
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://192.168.112.130:3306/nyw?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  cloud:
    nacos:
      server-addr: 192.168.112.130:8848
  redis:
    host: 192.168.112.130
    port: 6379
    password: 123456
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    com.nyw: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 犇牛商城商品管理接口文档
    description: "犇牛商城商品管理接口文档"
    email: 19371047352@163.com
    concat: NYW
    url: https://github.com/nyw-source
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.nyw.item.controller
